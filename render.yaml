# Rôle : décrit la mise en ligne d'Elsewhere chez Render (ELS-15). Render lit
# ce fichier (un « Blueprint ») et crée deux services à partir du dépôt GitHub :
# l'API Express et l'interface React. Les choix sont expliqués dans
# docs/adr/0003-hebergement-sur-render.md.
#
# Déploiement continu : à chaque fusion sur main, Render attend que la CI
# (.github/workflows/ci.yml) soit verte, puis déploie. Une CI rouge ne déploie
# rien : la version en ligne reste la précédente (story C13).
services:
  # L'API Express. Elle parle à la base PostgreSQL de Supabase.
  - type: web
    runtime: node
    name: elsewhere-api
    region: frankfurt              # proche de Supabase (Irlande) et des auditeurs européens
    plan: free                     # s'endort après inactivité ; passer en payant pour la soutenance
    rootDir: api
    buildCommand: npm ci
    # L'offre gratuite n'a pas de commande d'avant-déploiement : la migration
    # se lance au démarrage. Elle ne fait rien si la base est déjà à jour, et
    # si elle échoue, le serveur ne démarre pas : Render garde l'ancienne version.
    startCommand: npm run db:migrate && npm start
    healthCheckPath: /api/health   # Render vérifie cette route avant de basculer
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: "24"
      # Sécurité : l'adresse de la base contient son mot de passe. Render la
      # demande à la création du service ; elle n'est jamais écrite ici.
      - key: DATABASE_URL
        sync: false
      # Certificat public de Supabase, versionné dans api/certs/.
      - key: DATABASE_CA_CERT
        value: certs/supabase-ca.crt

  # L'interface React, construite par Vite en fichiers statiques (dist/).
  - type: web
    runtime: static
    name: elsewhere-web
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: "24"
    routes:
      # L'interface appelle /api/… sur sa propre adresse ; Render transmet à
      # l'API. Le navigateur ne voit qu'un seul site : pas de CORS à ouvrir.
      # Les règles sont lues dans l'ordre : celle-ci doit rester la première.
      # L'adresse est celle que Render a donnée à l'API (« -ypk5 » ajouté car
      # le nom elsewhere-api était déjà pris) : elle ne se devine pas.
      - type: rewrite
        source: /api/*
        destination: https://elsewhere-api-ypk5.onrender.com/api/*
      # Toute autre adresse renvoie la page de l'application : c'est React
      # qui affichera le bon écran.
      - type: rewrite
        source: /*
        destination: /index.html
