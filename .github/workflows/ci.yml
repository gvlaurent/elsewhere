# Rôle : intégration continue d'Elsewhere (ELS-14, story C13). À chaque push,
# sur n'importe quelle branche, GitHub Actions vérifie le code sur une machine
# neuve : ESLint et les tests pour l'API, ESLint et la construction pour
# l'interface. Une croix rouge sur la PR veut dire « ne pas fusionner ».
#
# Les tests qui touchent la base tournent dans un schéma jetable chez
# Supabase (voir docs/adr/0002). L'adresse de la base, mot de passe compris,
# vient du secret GitHub DATABASE_URL : sans ce secret, ces tests sont sautés
# au lieu d'échouer (requiresDatabase dans api/src/db/start-database-for-tests.js).
name: CI

on:
  push:
    branches: ['**']

# Sécurité : le jeton fourni par GitHub ne peut que lire le dépôt.
permissions:
  contents: read

# Deux pushes rapprochés sur la même branche : le premier contrôle, devenu
# inutile, est annulé.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint et tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      # npm ci installe exactement les versions de package-lock.json.
      - run: npm ci
      - run: npm run lint
      - run: npm test
        env:
          # Sécurité : GitHub masque la valeur du secret dans les journaux.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Certificat public versionné dans api/certs/ (pas un secret).
          DATABASE_CA_CERT: certs/supabase-ca.crt

  web:
    name: Interface (lint et construction)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      # Tests de l'interface (Vitest + Testing Library, ELS-21) : module
      # d'appel à l'API, formulaires, consentement. Aucun appel réseau réel.
      - run: npm test
      # La construction échoue si un import est cassé.
      - run: npm run build
